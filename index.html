<!doctype html><html lang="cs"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#111315"><meta name="color-scheme" content="dark light"><meta name="description" content="Botanic WMS — lehký skladový systém."><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="styles.css"><title>Botanic WMS</title></head><body>
